name: Build MOTH

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Engine tests + type checks (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install engine dependencies
        working-directory: core
        run: npm install --no-audit --no-fund
      - name: Type-check engine
        working-directory: core
        run: npm run typecheck
      - name: Engine tests (memory engine, MCP protocol with the official SDK, API, recovery)
        run: .github/ci-run.sh "Engine tests" npm --prefix core test
      - name: Install UI dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Type-check and build UI
        run: .github/ci-run.sh "UI build" npm --prefix app run build

  real-ai:
    name: Real local AI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MOTH_REAL_AI: "1"
      MOTH_REAL_DATA: ${{ github.workspace }}/real-ai-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache downloaded model (verified by SHA-256 on every run)
        uses: actions/cache@v4
        with:
          path: real-ai-data/ai/models
          key: moth-models-${{ hashFiles('core/src/cortex/manifest.ts') }}
      - name: Install engine dependencies
        shell: bash
        run: npm --prefix core install --no-audit --no-fund
      - name: Real inference acceptance test (llama.cpp + Qwen2.5 1.5B, no mocks)
        shell: bash
        run: .github/ci-run.sh "Real local AI" node --experimental-transform-types --disable-warning=ExperimentalWarning --test core/test-real/cortex.real.test.ts
      - name: Publish evidence
        if: always()
        shell: bash
        run: |
          [ -f real-ai-data/evidence.json ] && cat real-ai-data/evidence.json
          node .github/evidence.mjs real-ai-data/evidence.json

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm --prefix core install --no-audit --no-fund
          npm --prefix app install --no-audit --no-fund

      - name: Engine tests on Windows
        id: wintests
        continue-on-error: true   # keep building so compile problems surface in the same run; enforced at the end
        shell: bash
        run: .github/ci-run.sh "Windows engine tests" npm --prefix core test

      - name: Build memory engine sidecar (Node single executable)
        shell: bash
        run: |
          cd core
          ../.github/ci-run.sh "Bundle engine" npm run bundle
          ../.github/ci-run.sh "Build sidecar exe" npm run sea

      - name: Verify sidecar executable
        shell: pwsh
        run: |
          $env:MOTH_DATA_DIR = Join-Path $env:RUNNER_TEMP "moth-sidecar-test"
          $exe = "src-tauri/binaries/moth-core-x86_64-pc-windows-msvc.exe"
          & $exe version
          & $exe self-test
          if ($LASTEXITCODE -ne 0) { throw "MCP self-test failed" }
          & $exe status

      - name: Build UI
        shell: bash
        run: .github/ci-run.sh "UI build" npm --prefix app run build

      - name: Generate icons
        shell: bash
        run: .github/ci-run.sh "Icons" npx tauri icon src-tauri/app-icon.png

      - name: Rust tests
        shell: bash
        run: .github/ci-run.sh "Rust compile/tests" cargo test --manifest-path src-tauri/Cargo.toml --release

      - name: Build installer
        shell: bash
        run: .github/ci-run.sh "Installer build" npx tauri build

      - name: Install on this clean runner and smoke-test
        shell: pwsh
        run: |
          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Write-Host "Installing $($setup.FullName)"
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $dir = Join-Path $env:LOCALAPPDATA "MOTH"
          Get-ChildItem $dir | Format-Table Name, Length
          $core = Join-Path $dir "moth-core.exe"
          if (!(Test-Path $core)) { throw "moth-core.exe was not installed" }
          & $core self-test
          if ($LASTEXITCODE -ne 0) { throw "installed MCP server failed its self-test" }
          # Launch the real app; the shell must start the engine and create the brain.
          $app = Get-ChildItem $dir -Filter "*.exe" | Where-Object { $_.Name -notlike "moth-core*" -and $_.Name -notlike "uninstall*" } | Select-Object -First 1
          Start-Process $app.FullName
          Start-Sleep -Seconds 20
          $proc = Get-Process -Name "moth-core" -ErrorAction SilentlyContinue
          if (!$proc) { Get-ChildItem (Join-Path $env:LOCALAPPDATA "app.moth.desktop\logs") -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }; throw "the desktop app did not start the memory engine" }
          if (!(Test-Path (Join-Path $env:APPDATA "MOTH\moth.db"))) { throw "the brain database was not created" }
          Write-Host "App started the engine (pid $($proc.Id)) and created the brain."

          # Background operation: closing the window hides it to the tray; the engine keeps running.
          $ui = Get-Process -Name "MOTH" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($ui) { [void]$ui.CloseMainWindow() }
          Start-Sleep -Seconds 4
          if (!(Get-Process -Name "MOTH" -ErrorAction SilentlyContinue)) { throw "closing the window quit the app instead of hiding it to the tray" }
          if (!(Get-Process -Name "moth-core" -ErrorAction SilentlyContinue)) { throw "the memory engine stopped when the window was hidden" }
          Write-Host "Window close hid MOTH to the tray; the engine is still running."

          # MCP stays available while MOTH runs in the background (Claude launches its own server process).
          & $core self-test
          if ($LASTEXITCODE -ne 0) { throw "MCP self-test failed while MOTH was in the tray" }

          # Only one engine: launching MOTH again must not start a second app or engine.
          Start-Process $app.FullName
          Start-Sleep -Seconds 5
          $cores = @(Get-Process -Name "moth-core" -ErrorAction SilentlyContinue | Where-Object { $_.Id -eq $proc.Id -or $_.StartTime -gt (Get-Date).AddMinutes(-1) })
          $engines = @(Get-Process -Name "moth-core" -ErrorAction SilentlyContinue).Count
          Write-Host "moth-core processes after second launch: $engines"

          # Quit MOTH completely: everything owned by the app must stop, with a clean engine shutdown.
          Start-Process $app.FullName -ArgumentList "--quit"
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and (Get-Process -Name "MOTH","moth-core","llama-server" -ErrorAction SilentlyContinue)) { Start-Sleep -Milliseconds 500 }
          $left = Get-Process -Name "MOTH","moth-core","llama-server" -ErrorAction SilentlyContinue
          if ($left) { $left | Format-Table Name, Id; throw "processes were left running after Quit MOTH Completely" }
          $logs = Get-ChildItem (Join-Path $env:APPDATA "MOTH\logs") -Filter "moth-core*" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $clean = Select-String -Path $logs.FullName -Pattern "Clean shutdown" -Quiet
          if (!$clean) { Get-Content $logs.FullName -Tail 30; throw "the engine did not report a clean shutdown" }
          Write-Host "Quit completely: no MOTH, engine or model processes left; engine shut down cleanly."
          if ($engines -gt 1) { throw "a second launch started another memory engine ($engines running)" }

          # Update while Claude is using MOTH: Claude keeps its own moth-core.exe (MCP over stdin) running from
          # the install folder. Re-installing must still succeed and replace the file (real failure seen on a PC).
          $psi = New-Object System.Diagnostics.ProcessStartInfo $core, "mcp"
          $psi.UseShellExecute = $false; $psi.RedirectStandardInput = $true; $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true
          $mcp = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 3
          if ($mcp.HasExited) { throw "the simulated Claude MCP server did not stay running" }
          $before = (Get-Item $core).LastWriteTimeUtc
          (Get-Item $core).LastWriteTimeUtc = $before.AddDays(-1)
          $up = Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait -PassThru
          Write-Host "Update installer exit code: $($up.ExitCode)"
          if ($up.ExitCode -ne 0) { throw "updating while Claude's MOTH server was running failed (exit $($up.ExitCode))" }
          if ((Get-Item $core).LastWriteTimeUtc -le $before.AddDays(-1)) { throw "moth-core.exe was not replaced by the update" }
          & $core self-test
          if ($LASTEXITCODE -ne 0) { throw "MCP self-test failed after updating" }
          Write-Host "Update succeeded while Claude's MOTH server was running; the new server passes its self-test."

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MOTH-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Fail if Windows engine tests failed
        if: steps.wintests.outcome == 'failure'
        run: exit 1

      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      # Publishes on a v* tag, or on a main commit whose message contains [release].
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          name: MOTH v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes/v${{ steps.ver.outputs.v }}.md
          make_latest: true
          files: src-tauri/target/release/bundle/nsis/*.exe
