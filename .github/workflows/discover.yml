name: Discover runtime and model facts

# Prints exact, verifiable facts used to pin MOTH Cortex's manifest (no invented URLs or checksums).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/discover.yml"]

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: llama.cpp release assets (name, size, sha256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh api "repos/ggml-org/llama.cpp/releases?per_page=8" > rels.json
          jq -r '.[] | "\(.tag_name) prerelease=\(.prerelease) draft=\(.draft) assets=\(.assets|length) \(.published_at)"' rels.json | tee summary.txt
          # first release that actually ships Windows CPU binaries
          tag=$(jq -r '[.[] | select(any(.assets[]; .name | test("win-cpu-x64")))][0].tag_name' rels.json)
          echo "PICK $tag" >> summary.txt
          jq -r --arg t "$tag" '.[] | select(.tag_name==$t) | .assets[] | select(.name | test("win-(cpu|vulkan)-x64|ubuntu-x64|ubuntu-vulkan")) | "\(.name) \(.size) \(.digest) \(.browser_download_url)"' rels.json >> summary.txt
          echo "::warning title=llama.cpp assets::$(awk 'BEGIN{ORS="%0A"}{print}' summary.txt)"

      - name: Hugging Face GGUF files (path, size, sha256)
        run: |
          set -e
          out=""
          for repo in Qwen/Qwen2.5-0.5B-Instruct-GGUF Qwen/Qwen2.5-1.5B-Instruct-GGUF Qwen/Qwen2.5-3B-Instruct-GGUF Qwen/Qwen2.5-7B-Instruct-GGUF; do
            json=$(curl -sSL "https://huggingface.co/api/models/$repo/tree/main")
            lic=$(curl -sSL "https://huggingface.co/api/models/$repo" | jq -r '[.tags[] | select(startswith("license:"))] | join(",")')
            rows=$(echo "$json" | jq -r --arg r "$repo" --arg l "$lic" '.[] | select(.path | test("q4_k_m.gguf$")) | "\($r) \(.path) \(.lfs.size // .size) \(.lfs.oid) license=\($l)"')
            echo "$rows"
            out="$out$rows%0A"
          done
          echo "::warning title=GGUF models::${out}"
