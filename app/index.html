<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/moth.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOTH</title>
    <style>
      /* Startup: a light appears, the moth unfolds its wings once, a few motes drift outward, then it fades into the app.
         Pure HTML/CSS/SVG so it shows before any script loads; it never waits for itself (see main.tsx). */
      #moth-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #101014; transition: opacity 0.38s cubic-bezier(0.2, 0.8, 0.2, 1); }
      #moth-splash.out { opacity: 0; pointer-events: none; }
      #moth-splash .stage { position: relative; width: 120px; height: 120px; display: grid; place-items: center; }
      #moth-splash .light { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #c4b5fd; box-shadow: 0 0 18px 6px rgba(167, 139, 250, 0.55); opacity: 0; animation: ms-light 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
      #moth-splash .halo { position: absolute; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(167, 139, 250, 0.16), rgba(167, 139, 250, 0) 65%); opacity: 0; animation: ms-halo 1.7s ease-out forwards; }
      #moth-splash svg { position: relative; width: 84px; height: 84px; color: #c4b5fd; opacity: 0; animation: ms-moth 1.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; filter: drop-shadow(0 0 10px rgba(167, 139, 250, 0.45)); }
      #moth-splash .wl, #moth-splash .wr { transform-origin: 32px 30px; transform-box: view-box; animation: ms-unfold 0.9s cubic-bezier(0.25, 0.9, 0.3, 1) 0.35s both; }
      #moth-splash .mote { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #d9d3f5; opacity: 0; animation: ms-mote 1.1s ease-out 0.75s forwards; }
      #moth-splash .word { position: absolute; top: calc(50% + 62px); left: 50%; transform: translateX(-50%); font: 600 13px "Segoe UI", system-ui, sans-serif; letter-spacing: 0.32em; color: #f5f5f7; opacity: 0; animation: ms-word 1.7s ease-out forwards; white-space: nowrap; }
      #moth-splash .wait { position: absolute; top: calc(50% + 88px); left: 50%; transform: translateX(-50%); font: 400 12px "Segoe UI", system-ui, sans-serif; color: #6b6b7a; opacity: 0; transition: opacity 0.4s; white-space: nowrap; }
      #moth-splash.slow .wait { opacity: 1; }
      #moth-splash.slow svg { animation: ms-breathe 2.4s ease-in-out infinite; opacity: 0.85; }
      @keyframes ms-light { 0% { opacity: 0; transform: scale(0.2); } 25% { opacity: 1; transform: scale(1); } 60% { opacity: 0.9; transform: scale(1.6); } 100% { opacity: 0; transform: scale(3); } }
      @keyframes ms-halo { 0% { opacity: 0; transform: scale(0.6); } 40% { opacity: 1; } 100% { opacity: 0.55; transform: scale(1); } }
      @keyframes ms-moth { 0% { opacity: 0; transform: scale(0.9); } 30% { opacity: 1; transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0.85; } }
      @keyframes ms-unfold { 0% { transform: scaleX(0.12) scaleY(0.86); } 70% { transform: scaleX(1.06) scaleY(1); } 100% { transform: scaleX(1) scaleY(1); } }
      @keyframes ms-mote { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 0.9; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
      @keyframes ms-word { 0%, 35% { opacity: 0; } 70%, 100% { opacity: 0.9; } }
      @keyframes ms-breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.95; } }
      @media (prefers-reduced-motion: reduce) {
        #moth-splash .light, #moth-splash .halo, #moth-splash .mote { display: none; }
        #moth-splash svg, #moth-splash .word { animation: none; opacity: 1; }
        #moth-splash .wl, #moth-splash .wr { animation: none; }
        #moth-splash.slow svg { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="moth-splash" aria-hidden="true">
      <div class="stage">
        <div class="halo"></div>
        <div class="light"></div>
        <svg viewBox="0 0 64 64">
          <g fill="currentColor" fill-rule="evenodd">
            <g class="wl">
              <path d="M30.6 25.5 9 13.5l4.6 19.8 17-1.6Zm-11.1 1.9a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
              <path d="M30.4 34.2 14.8 36.6l9 13.4 6.6-8.8Z" opacity=".72" />
            </g>
            <g class="wr">
              <path d="M33.4 25.5 55 13.5l-4.6 19.8-17-1.6Zm11.1 1.9a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z" />
              <path d="M33.6 34.2l15.6 2.4-9 13.4-6.6-8.8Z" opacity=".72" />
            </g>
            <path d="M32 18.5 34.4 31 32 51.5 29.6 31Z" />
          </g>
          <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="M31 18.3c-1.6-4.8-4.6-8-8.6-9.2M33 18.3c1.6-4.8 4.6-8 8.6-9.2" />
          </g>
        </svg>
        <span class="mote" style="--dx: -54px; --dy: -30px"></span>
        <span class="mote" style="--dx: 58px; --dy: -24px"></span>
        <span class="mote" style="--dx: -40px; --dy: 44px"></span>
        <span class="mote" style="--dx: 46px; --dy: 40px"></span>
        <span class="mote" style="--dx: 4px; --dy: -62px"></span>
        <span class="mote" style="--dx: -66px; --dy: 6px"></span>
      </div>
      <div class="word">MOTH</div>
      <div class="wait">Waking up the memory engine…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
